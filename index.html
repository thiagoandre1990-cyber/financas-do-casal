<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thiago E Jullia - Finanças do Casal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6fb;color:#172033}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:26px;margin:0}.muted{color:#667085}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls select,.controls button,input,select,textarea{border:1px solid #d8dee9;border-radius:8px;padding:10px;background:#fff;font:inherit}button{cursor:pointer;border:0;background:#2536a8;color:white;font-weight:700}.secondary{background:#e9edf8;color:#24304a}.danger{background:#d92d20}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #e2e7f0;border-radius:14px;padding:16px;box-shadow:0 1px 3px #00000008}.label{font-size:13px;color:#667085}.value{font-size:25px;font-weight:800;margin-top:5px}.green{color:#16803c}.red{color:#d92d20}.blue{color:#2457c5}.tabs{display:flex;gap:8px;margin:12px 0}.tab{background:#e9edf8;color:#24304a}.tab.active{background:#2536a8;color:#fff}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf0f5;font-size:13px}th{color:#667085}.bar{height:10px;background:#edf0f5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#4b63d3}.rowx{margin:9px 0}.rowx .line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.hidden{display:none}.msg{margin:8px 0;padding:10px;border-radius:8px;background:#eef4ff;color:#24408e}.error{background:#fff0f0;color:#a61b1b}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.wrap{padding:12px}h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>Thiago E Jullia - Finanças do Casal</h1><div class="muted">Controle financeiro compartilhado</div></div><div class="controls"><select id="year"></select><select id="month"></select><button class="secondary" id="refresh">Atualizar</button></div></div>
<div id="message" class="msg hidden"></div>
<div class="cards"><div class="card"><div class="label">Entradas</div><div id="income" class="value green">R$ 0,00</div></div><div class="card"><div class="label">Despesas</div><div id="expense" class="value red">R$ 0,00</div></div><div class="card"><div class="label">Saldo</div><div id="balance" class="value blue">R$ 0,00</div></div><div class="card"><div class="label">Lançamentos</div><div id="count" class="value">0</div></div></div>
<div class="tabs"><button class="tab active" data-tab="dash">Dashboard</button><button class="tab" data-tab="form">Lançamentos</button><button class="tab" data-tab="history">Histórico</button></div>
<section id="dash" class="tabbody"><div class="grid"><div class="panel"><h3>Resumo por grupo</h3><div id="groups"></div></div><div class="panel"><h3>Resumo por responsável</h3><div id="people"></div></div></div></section>
<section id="form" class="tabbody hidden"><div class="panel"><h2>Novo lançamento</h2><form id="txForm"><div class="formgrid"><div><label>Tipo</label><select id="type"><option value="despesa">Despesa</option><option value="entrada">Entrada</option></select></div><div><label>Data</label><input id="date" type="date" required></div><div><label>Descrição</label><input id="description" placeholder="Ex.: Mercado" required></div><div><label>Valor</label><input id="amount" type="number" min="0" step="0.01" required></div><div><label>Grupo</label><select id="group"></select></div><div><label>Categoria</label><input id="category" placeholder="Opcional"></div><div><label>Responsável</label><select id="responsible"><option>Thiago</option><option>Jullia</option><option>Lara</option></select></div><div class="full"><label>Observação</label><textarea id="notes" rows="3" placeholder="Opcional"></textarea></div><div class="full"><button type="submit">Adicionar lançamento</button></div></div></form></div></section>
<section id="history" class="tabbody hidden"><div class="panel"><h2>Histórico</h2><div style="overflow:auto"><table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Grupo</th><th>Responsável</th><th>Valor</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
</div>
<script>
const SUPABASE_URL="https://dkqjxhqrieewmmooemoh.supabase.co";
const SUPABASE_KEY="sb_publishable__-TfG8w5BzGtU5F76pTtYg_xfRPhOEJ";
const TABLE="transactions";
const GROUPS=["Aluguel","Água","Luz","Internet","Faculdade","Cartão","Celular","Academia","Consórcio","Investimento","Médico","Pensão","Plano de Saúde","Passagem Aérea","Hospedagem","Aluguel de Carro","Salário"];
let data=[];
const $=id=>document.getElementById(id);const brl=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0);
function api(path,opts={}){opts.headers={...(opts.headers||{}),apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};return fetch(SUPABASE_URL+"/rest/v1/"+path,opts)}
function msg(t,error=false){$("message").textContent=t;$("message").className="msg"+(error?" error":"");setTimeout(()=>$("message").className="msg hidden",3500)}
function localDate(){const d=new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function init(){const now=new Date(),y=now.getFullYear();for(let i=y-2;i<=y+5;i++)$("year").insertAdjacentHTML("beforeend",`<option>${i}</option>`);$("year").value=y;const months=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];months.forEach((m,i)=>$("month").insertAdjacentHTML("beforeend",`<option value="${i+1}">${m}</option>`));$("month").value=now.getMonth()+1;GROUPS.forEach(g=>$("group").insertAdjacentHTML("beforeend",`<option>${g}</option>`));$("date").value=localDate()}
function range(){const y=+$("year").value,m=+$("month").value;const a=`${y}-${String(m).padStart(2,"0")}-01`;const b=new Date(y,m,1).toISOString().slice(0,10);return[a,b]}
async function load(){try{const[a,b]=range();const r=await api(`${TABLE}?select=*&date=gte.${a}&date=lt.${b}&order=date.desc,created_at.desc`);if(!r.ok)throw new Error(await r.text());data=await r.json();render()}catch(e){msg("Não foi possível carregar os lançamentos. Verifique a tabela transactions no Supabase.",true);console.error(e)}}
function render(){const inc=data.filter(x=>x.type==="entrada").reduce((s,x)=>s+Number(x.amount),0);const exp=data.filter(x=>x.type==="despesa").reduce((s,x)=>s+Number(x.amount),0);$("income").textContent=brl(inc);$("expense").textContent=brl(exp);$("balance").textContent=brl(inc-exp);$("count").textContent=data.length;const by={};data.forEach(x=>{if(x.type==="despesa")by[x.group_name]=(by[x.group_name]||0)+Number(x.amount)});const max=Math.max(1,...Object.values(by));$("groups").innerHTML=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="rowx"><div class="line"><span>${k}</span><b>${brl(v)}</b></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`).join("")||'<span class="muted">Sem despesas neste período.</span>';const pp={Thiago:0,Jullia:0,Lara:0};data.forEach(x=>{if(x.type==="despesa"&&pp[x.responsible]!=null)pp[x.responsible]+=Number(x.amount)});$("people").innerHTML=Object.entries(pp).map(([k,v])=>`<div class="rowx"><div class="line"><span>${k}</span><b>${brl(v)}</b></div></div>`).join("");$("rows").innerHTML=data.map(x=>`<tr><td>${x.date||""}</td><td>${x.type||""}</td><td>${x.description||""}</td><td>${x.group_name||""}</td><td>${x.responsible||""}</td><td>${brl(x.amount)}</td><td><button class="danger" onclick="removeTx('${x.id}')">Excluir</button></td></tr>`).join("")||'<tr><td colspan="7">Nenhum lançamento.</td></tr>'}
$("txForm").addEventListener("submit",async e=>{e.preventDefault();const payload={type:$("type").value,date:$("date").value,description:$("description").value,amount:Number($("amount").value),group_name:$("group").value,category:$("category").value||null,responsible:$("responsible").value,notes:$("notes").value||null};try{const r=await api(TABLE,{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());msg("Lançamento adicionado.");e.target.reset();$("date").value=localDate();load();document.querySelector('[data-tab="history"]').click()}catch(e){msg("Erro ao salvar: "+e.message,true)}});
async function removeTx(id){if(!confirm("Excluir este lançamento?"))return;try{const r=await api(`${TABLE}?id=eq.${encodeURIComponent(id)}`,{method:"DELETE"});if(!r.ok)throw new Error(await r.text());msg("Lançamento excluído.");load()}catch(e){msg("Erro ao excluir: "+e.message,true)}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tabbody").forEach(x=>x.classList.add("hidden"));b.classList.add("active");$(b.dataset.tab).classList.remove("hidden");if(b.dataset.tab==="form")$("date").value=localDate()});$("year").onchange=load;$("month").onchange=load;$("refresh").onclick=load;init();load();
</script>
</body></html>
